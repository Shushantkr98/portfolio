<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout — ÉLAN</title>

    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- EXISTING CSS -->

    <link rel="stylesheet" href="product.css">

</head>


<body>


    <!-- ANNOUNCEMENT -->

    <div class="announcement">

        FREE SHIPPING ON ORDERS OVER ₹2,999

    </div>


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="E_commerce.html" class="logo">

            ÉLAN

        </a>


        <div class="checkout-secure">

            SECURE CHECKOUT 🔒

        </div>


        <a
            href="cart.html"
            class="back-cart"
        >

            ← BACK TO BAG

        </a>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">


        <!-- LEFT SIDE -->

        <section class="checkout-form-section">


            <p class="eyebrow">

                ÉLAN / CHECKOUT

            </p>


            <h1>

                Complete your
                <em>order.</em>

            </h1>


            <!-- CONTACT -->

            <div class="checkout-block">

                <div class="checkout-block-title">

                    <span>01</span>

                    <h2>

                        Contact Information

                    </h2>

                </div>


                <div class="form-grid">


                    <div class="form-group full">

                        <label>

                            EMAIL ADDRESS

                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>

                            PHONE NUMBER

                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="+91 00000 00000"
                            required
                        >

                    </div>

                </div>

            </div>


            <!-- SHIPPING -->

            <div class="checkout-block">

                <div class="checkout-block-title">

                    <span>02</span>

                    <h2>

                        Shipping Address

                    </h2>

                </div>


                <div class="form-grid">


                    <div class="form-group">

                        <label>

                            FIRST NAME

                        </label>

                        <input
                            type="text"
                            id="firstName"
                            placeholder="First name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>

                            LAST NAME

                        </label>

                        <input
                            type="text"
                            id="lastName"
                            placeholder="Last name"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label>

                            ADDRESS

                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="House number and street"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>

                            CITY

                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="City"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>

                            STATE

                        </label>

                        <input
                            type="text"
                            id="state"
                            placeholder="State"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>

                            PIN CODE

                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="000000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>

                            COUNTRY

                        </label>

                        <input
                            type="text"
                            value="India"
                            readonly
                        >

                    </div>

                </div>

            </div>


            <!-- PAYMENT -->

            <div class="checkout-block">

                <div class="checkout-block-title">

                    <span>03</span>

                    <h2>

                        Payment Method

                    </h2>

                </div>


                <div class="payment-options">


                    <label class="payment-option active">

                        <input
                            type="radio"
                            name="payment"
                            value="cod"
                            checked
                        >

                        <div>

                            <strong>

                                Cash on Delivery

                            </strong>

                            <span>

                                Pay when your order arrives

                            </span>

                        </div>

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="online"
                        >

                        <div>

                            <strong>

                                Online Payment

                            </strong>

                            <span>

                                UPI / Card / Net Banking

                            </span>

                        </div>

                    </label>


                </div>

            </div>


        </section>


        <!-- RIGHT SIDE ORDER SUMMARY -->

        <aside class="checkout-summary">


            <p class="eyebrow">

                YOUR ORDER

            </p>


            <h2>

                Order Summary

            </h2>


            <!-- PRODUCTS JS SE AAYENGE -->

            <div
                class="checkout-products"
                id="checkoutProducts"
            ></div>


            <div class="checkout-line"></div>


            <div class="checkout-price-row">

                <span>

                    SUBTOTAL

                </span>

                <strong id="checkoutSubtotal">

                    ₹0

                </strong>

            </div>


            <div class="checkout-price-row">

                <span>

                    SHIPPING

                </span>

                <strong id="shippingCost">

                    FREE

                </strong>

            </div>


            <div class="checkout-total">

                <span>

                    TOTAL

                </span>

                <strong id="checkoutTotal">

                    ₹0

                </strong>

            </div>


            <button
                class="place-order-btn"
                id="placeOrderBtn"
            >

                PLACE ORDER →

            </button>


            <p class="secure-text">

                🔒 Your payment information is secure.

            </p>


        </aside>


    </main>


    <!-- JAVASCRIPT -->

    <script src="checkout.js"></script>


</body>

</html>

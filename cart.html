<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bag — ÉLAN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="E_commerce.css">

    <style>

        /* =========================
           CART PAGE
        ========================= */

        .cart-page {
            padding: 80px 5vw 120px;
        }

        .cart-header {
            margin-bottom: 55px;
        }

        .cart-header h1 {
            font-family: "Playfair Display", serif;
            font-size: clamp(55px, 7vw, 95px);
            font-weight: 400;
            line-height: .9;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.5fr .7fr;
            gap: 7vw;
            align-items: start;
        }

        /* =========================
           CART ITEMS
        ========================= */

        .cart-items {
            border-top: 1px solid #ccc8c0;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 150px 1fr auto;
            gap: 25px;
            padding: 25px 0;
            border-bottom: 1px solid #ccc8c0;
        }

        .cart-item-image {
            width: 150px;
            height: 190px;
            overflow: hidden;
            background: #dedbd4;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cart-item-info h3 {
            font-family: "Playfair Display", serif;
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .cart-item-info p {
            color: #77736d;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            width: fit-content;
            border: 1px solid #aaa;
        }

        .cart-quantity button {
            width: 35px;
            height: 35px;
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
        }

        .cart-quantity span {
            width: 35px;
            text-align: center;
            font-size: 11px;
        }

        .cart-item-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        .cart-item-price {
            font-size: 13px;
            font-weight: 600;
        }

        .remove-btn {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 9px;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #171717;
            padding-bottom: 4px;
        }

        /* =========================
           SUMMARY
        ========================= */

        .cart-summary {
            background: #eeebe4;
            padding: 35px;
            position: sticky;
            top: 110px;
        }

        .cart-summary h2 {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 30px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 18px;
        }

        .summary-row span:last-child {
            font-weight: 600;
        }

        .summary-total {
            border-top: 1px solid #c8c4bc;
            padding-top: 20px;
            margin-top: 25px;
            font-size: 14px;
        }

        .checkout-btn {
            width: 100%;
            border: 0;
            background: #171717;
            color: #fff;
            padding: 18px;
            margin-top: 25px;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 2px;
            transition: .3s ease;
        }

        .checkout-btn:hover {
            background: #333;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-decoration: underline;
        }

        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {
            text-align: center;
            padding: 100px 20px;
            display: none;
        }

        .empty-cart h2 {
            font-family: "Playfair Display", serif;
            font-size: 50px;
            font-weight: 400;
            margin-bottom: 15px;
        }

        .empty-cart p {
            color: #77736d;
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #171717;
            color: #fff;
            padding: 15px 22px;
            font-size: 11px;
            transform: translateY(100px);
            opacity: 0;
            transition: .4s ease;
            z-index: 5000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .cart-page {
                padding: 60px 20px 80px;
            }

            .cart-layout {
                display: block;
            }

            .cart-summary {
                position: static;
                margin-top: 40px;
            }

            .cart-item {
                grid-template-columns: 100px 1fr;
                gap: 15px;
            }

            .cart-item-image {
                width: 100px;
                height: 135px;
            }

            .cart-item-right {
                grid-column: 2;
                flex-direction: row;
                align-items: center;
            }

            .cart-item-info h3 {
                font-size: 19px;
            }

        }

    </style>
</head>


<body>

    <!-- Announcement -->

    <div class="announcement">
        FREE SHIPPING ON ORDERS OVER ₹2,999
    </div>


    <!-- Navbar -->

    <header class="navbar">

        <a href="E_commerce.html" class="logo">
            ÉLAN
        </a>

        <nav class="nav-links" id="navLinks">

            <a href="new.html">NEW IN</a>
            <a href="women.html">WOMEN</a>
            <a href="men.html">MEN</a>
            <a href="E_commerce.html#collections">COLLECTIONS</a>
            <a href="sale.html">SALE</a>

        </nav>


        <div class="nav-actions">

            <button class="icon-btn" id="searchBtn">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="11"
                        cy="11"
                        r="7">
                    </circle>

                    <line
                        x1="16.5"
                        y1="16.5"
                        x2="22"
                        y2="22">
                    </line>

                </svg>

            </button>


            <button class="icon-btn">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="4">
                    </circle>

                    <path
                        d="M4 21c0-4 3.5-7 8-7s8 3 8 7">
                    </path>

                </svg>

            </button>


            <a href="cart.html" class="bag-btn">

                BAG
                <span id="cartCount">0</span>

            </a>


            <button class="menu-btn" id="menuBtn">
                ☰
            </button>

        </div>

    </header>


    <!-- Search -->

    <div class="search-overlay" id="searchOverlay">

        <button class="close-search" id="closeSearch">
            ×
        </button>

        <div class="search-box">

            <span>SEARCH</span>

            <input
                type="text"
                placeholder="What are you looking for?"
            >

        </div>

    </div>


    <!-- CART -->

    <main>

        <section class="cart-page">

            <div class="cart-header">

                <p class="eyebrow">
                    YOUR SELECTION
                </p>

                <h1>
                    Your Bag
                </h1>

            </div>


            <!-- EMPTY -->

            <div
                class="empty-cart"
                id="emptyCart"
            >

                <h2>
                    Your bag is empty.
                </h2>

                <p>
                    Discover something you love.
                </p>

                <a
                    href="new.html"
                    class="btn btn-dark"
                >
                    SHOP NEW ARRIVALS
                </a>

            </div>


            <!-- CART -->

            <div
                class="cart-layout"
                id="cartLayout"
            >

                <div
                    class="cart-items"
                    id="cartItems"
                >
                </div>


                <!-- SUMMARY -->

                <aside class="cart-summary">

                    <h2>
                        Summary
                    </h2>

                    <div class="summary-row">

                        <span>
                            SUBTOTAL
                        </span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            SHIPPING
                        </span>

                        <span id="shipping">
                            ₹0
                        </span>

                    </div>


                    <div class="summary-row summary-total">

                        <span>
                            TOTAL
                        </span>

                        <span id="total">
                            ₹0
                        </span>

                    </div>


                    <button
                        class="checkout-btn"
                        id="checkoutBtn"
                    >
                        PROCEED TO CHECKOUT
                    </button>


                    <a
                        href="new.html"
                        class="continue-shopping"
                    >
                        CONTINUE SHOPPING
                    </a>

                </aside>

            </div>

        </section>

    </main>


    <!-- Toast -->

    <div
        class="toast"
        id="toast"
    >
        Updated ✓
    </div>


    <script>

        /* =========================
           CART
        ========================= */

        function getCart() {

            return JSON.parse(
                localStorage.getItem("elanCart")
            ) || [];

        }


        function saveCart(cart) {

            localStorage.setItem(
                "elanCart",
                JSON.stringify(cart)
            );

        }


        /* =========================
           CART COUNT
        ========================= */

        function updateCartCount() {

            const cart = getCart();

            const total = cart.reduce(
                (sum, item) =>
                    sum + item.quantity,
                0
            );

            document.getElementById(
                "cartCount"
            ).textContent = total;

        }


        /* =========================
           FORMAT PRICE
        ========================= */

        function formatPrice(price) {

            return "₹" +
                Number(price).toLocaleString("en-IN");

        }


        /* =========================
           RENDER CART
        ========================= */

        function renderCart() {

            const cart = getCart();

            const cartItems =
                document.getElementById("cartItems");

            const cartLayout =
                document.getElementById("cartLayout");

            const emptyCart =
                document.getElementById("emptyCart");


            if (cart.length === 0) {

                cartLayout.style.display = "none";

                emptyCart.style.display = "block";

                updateCartCount();

                return;

            }


            cartLayout.style.display = "grid";

            emptyCart.style.display = "none";


            cartItems.innerHTML = "";


            cart.forEach((item, index) => {

                const article =
                    document.createElement("article");

                article.className = "cart-item";


                article.innerHTML = `

                    <div class="cart-item-image">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >

                    </div>


                    <div class="cart-item-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            ÉLAN / Selected Style
                        </p>


                        <div class="cart-quantity">

                            <button
                                data-action="minus"
                                data-index="${index}"
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                data-action="plus"
                                data-index="${index}"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <div class="cart-item-right">

                        <strong class="cart-item-price">

                            ${formatPrice(
                                item.price * item.quantity
                            )}

                        </strong>


                        <button
                            class="remove-btn"
                            data-action="remove"
                            data-index="${index}"
                        >
                            REMOVE
                        </button>

                    </div>

                `;


                cartItems.appendChild(article);

            });


            updateSummary();

            updateCartCount();

        }


        /* =========================
           SUMMARY
        ========================= */

        function updateSummary() {

            const cart = getCart();


            const subtotal =
                cart.reduce(
                    (sum, item) =>
                        sum +
                        Number(item.price) *
                        item.quantity,
                    0
                );


            const shipping =
                subtotal === 0
                    ? 0
                    : subtotal >= 2999
                        ? 0
                        : 99;


            const total =
                subtotal + shipping;


            document.getElementById(
                "subtotal"
            ).textContent =
                formatPrice(subtotal);


            document.getElementById(
                "shipping"
            ).textContent =
                shipping === 0
                    ? "FREE"
                    : formatPrice(shipping);


            document.getElementById(
                "total"
            ).textContent =
                formatPrice(total);

        }


        /* =========================
           CART ACTIONS
        ========================= */

        document
            .getElementById("cartItems")
            .addEventListener(
                "click",
                event => {

                    const button =
                        event.target.closest("button");

                    if (!button) return;


                    const index =
                        Number(button.dataset.index);

                    const action =
                        button.dataset.action;


                    const cart = getCart();


                    if (!cart[index]) return;


                    if (action === "plus") {

                        cart[index].quantity++;

                    }


                    if (action === "minus") {

                        cart[index].quantity--;

                        if (
                            cart[index].quantity <= 0
                        ) {

                            cart.splice(index, 1);

                        }

                    }


                    if (action === "remove") {

                        cart.splice(index, 1);

                    }


                    saveCart(cart);

                    renderCart();


                    showToast(
                        "Bag updated ✓"
                    );

                }
            );


        /* =========================
           TOAST
        ========================= */

        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.textContent = message;

            toast.classList.add("show");


            setTimeout(() => {

                toast.classList.remove("show");

            }, 1800);

        }


        /* =========================
           CHECKOUT
        ========================= */

        document
    .getElementById("checkoutBtn")
    .addEventListener("click", () => {

        const cart = getCart();

        if (cart.length === 0) {

            showToast("Your bag is empty");

            return;

        }

        window.location.href = "checkout.html";

    });


        /* =========================
           MOBILE MENU
        ========================= */

        document
            .getElementById("menuBtn")
            .addEventListener(
                "click",
                () => {

                    document
                        .getElementById("navLinks")
                        .classList
                        .toggle("active");

                }
            );


        /* =========================
           SEARCH
        ========================= */

        const searchBtn =
            document.getElementById("searchBtn");

        const searchOverlay =
            document.getElementById("searchOverlay");

        const closeSearch =
            document.getElementById("closeSearch");


        searchBtn.addEventListener(
            "click",
            () => {

                searchOverlay
                    .classList
                    .add("active");

                document.body.style.overflow =
                    "hidden";

            }
        );


        closeSearch.addEventListener(
            "click",
            () => {

                searchOverlay
                    .classList
                    .remove("active");

                document.body.style.overflow =
                    "";

            }
        );


        /* =========================
           INITIAL
        ========================= */

        renderCart();

    </script>

</body>

</html>
